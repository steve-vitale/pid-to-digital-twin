# One-click demo: the twin in Ignition, with live data, on this computer only.
# Easiest: double-click start-demo.bat (Windows). Or run: docker compose up -d
# Then open http://localhost:8088/data/perspective/client/PIDTwin
# Details and the plain-language guide: docker/README.md

services:
  # Ignition 8.3, restored on first start from a prepared demo backup: the Twin tag provider (Tennessee Eastman
  # plant + the extracted OPEN100 twin), the PIDTwin screens, and read-only connections to the two data servers.
  gateway:
    image: inductiveautomation/ignition:8.3.10
    ports:
      - "127.0.0.1:8088:8088"   # this computer only, never the network
    volumes:
      - gateway-data:/usr/local/bin/ignition/data
      - ./docker/twin-demo.gwbk:/restore.gwbk:ro
    environment:
      - ACCEPT_IGNITION_EULA=Y   # you accept Ignition's licence agreement by starting this demo
      - IGNITION_EDITION=standard
      - TZ=UTC
    command: -n twin-demo -r /restore.gwbk
    depends_on: [te-sim, demo-points]

  # Tennessee Eastman replay (open data). TE_RUN=fault6 replays fault 6 (loss of A feed) instead of normal operation.
  te-sim:
    build: { context: ., dockerfile: docker/sim.Dockerfile }
    image: pid-twin-sims
    command: python scripts/ignition/te_sim_server.py --run ${TE_RUN:-normal} --start ${TE_START:-0}

  # Synthetic values for the OPEN100 points mapped from the demo I/O list.
  demo-points:
    build: { context: ., dockerfile: docker/sim.Dockerfile }
    image: pid-twin-sims
    command: python scripts/ignition/demo_points_server.py

volumes:
  gateway-data:
