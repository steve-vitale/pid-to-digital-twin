<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 316" width="300" height="316"><title>V-101 Vapor/Liquid Separator</title><defs><style>.eq{fill:#fff;stroke:#1f2937;stroke-width:2}.ln{fill:none;stroke:#1f2937;stroke-width:2}.pipe{fill:none;stroke:#475569;stroke-width:2.5}.inst{fill:#fff;stroke:#2563eb;stroke-width:1.5}.t{font:12px Arial,sans-serif;fill:#1f2937}.ti{font:bold 10px Arial,sans-serif;fill:#2563eb}.ts{font:10px Arial,sans-serif;fill:#64748b}</style><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><g id="V-101" data-asset="V-101" data-type="separator" transform="translate(150,140)"><rect class="eq" x="-85" y="-35" width="170" height="70" rx="35"/><rect class="eq" x="30" y="35" width="30" height="25"/><text class="t" y="-72" text-anchor="middle">V-101 Vapor/Liquid Separator</text></g><g id="TI-111" data-tag="TI-111" data-unit="V-101" data-uom="degC" transform="translate(54.0,250)"><title>TI-111: Separator temperature</title><rect class="inst" x="-19" y="-19" width="38" height="38"/><circle class="inst" r="17"/><line class="inst" x1="-17" y1="0" x2="17" y2="0"/><text class="ti" y="-4" text-anchor="middle">TI</text><text class="ti" y="11" text-anchor="middle">111</text></g><g id="LI-112" data-tag="LI-112" data-unit="V-101" data-uom="%" transform="translate(102.0,250)"><title>LI-112: Separator level</title><rect class="inst" x="-19" y="-19" width="38" height="38"/><circle class="inst" r="17"/><line class="inst" x1="-17" y1="0" x2="17" y2="0"/><text class="ti" y="-4" text-anchor="middle">LI</text><text class="ti" y="11" text-anchor="middle">112</text></g><g id="PI-113" data-tag="PI-113" data-unit="V-101" data-uom="kPa g" transform="translate(150.0,250)"><title>PI-113: Separator pressure</title><rect class="inst" x="-19" y="-19" width="38" height="38"/><circle class="inst" r="17"/><line class="inst" x1="-17" y1="0" x2="17" y2="0"/><text class="ti" y="-4" text-anchor="middle">PI</text><text class="ti" y="11" text-anchor="middle">113</text></g><g id="FI-114" data-tag="FI-114" data-unit="V-101" data-uom="m3/h" transform="translate(198.0,250)"><title>FI-114: Separator underflow</title><rect class="inst" x="-19" y="-19" width="38" height="38"/><circle class="inst" r="17"/><line class="inst" x1="-17" y1="0" x2="17" y2="0"/><text class="ti" y="-4" text-anchor="middle">FI</text><text class="ti" y="11" text-anchor="middle">114</text></g><g id="LV-207" data-tag="LV-207" data-unit="V-101" data-uom="%" transform="translate(246.0,250)"><title>LV-207: Separator pot liquid flow valve</title><path class="inst" d="M-14 -8 L14 8 L14 -8 L-14 8 Z"/><line class="inst" x1="0" y1="0" x2="0" y2="-16"/><path class="inst" d="M-9 -16 A9 9 0 0 1 9 -16 Z"/><text class="ti" y="22" text-anchor="middle">LV-207</text></g></svg>
