<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 387" width="300" height="387"><title>R-101 Reactor</title><defs><style>.eq{fill:#fff;stroke:#1f2937;stroke-width:2}.ln{fill:none;stroke:#1f2937;stroke-width:2}.pipe{fill:none;stroke:#475569;stroke-width:2.5}.inst{fill:#fff;stroke:#2563eb;stroke-width:1.5}.t{font:12px Arial,sans-serif;fill:#1f2937}.ti{font:bold 10px Arial,sans-serif;fill:#2563eb}.ts{font:10px Arial,sans-serif;fill:#64748b}</style><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><g id="R-101" data-asset="R-101" data-type="reactor" transform="translate(150,140)"><rect class="eq" x="-45" y="-75" width="90" height="150" rx="40"/><line class="ln" x1="0" y1="-95" x2="0" y2="35"/><path class="ln" d="M-22 35 L22 35 M-22 28 L-22 42 M22 28 L22 42"/><rect class="eq" x="-12" y="-110" width="24" height="15"/><text class="t" y="-122" text-anchor="middle">R-101 Reactor</text></g><g id="FI-106" data-tag="FI-106" data-unit="R-101" data-uom="kscmh" transform="translate(54.0,265)"><title>FI-106: Reactor feed rate</title><rect class="inst" x="-19" y="-19" width="38" height="38"/><circle class="inst" r="17"/><line class="inst" x1="-17" y1="0" x2="17" y2="0"/><text class="ti" y="-4" text-anchor="middle">FI</text><text class="ti" y="11" text-anchor="middle">106</text></g><g id="PI-107" data-tag="PI-107" data-unit="R-101" data-uom="kPa g" transform="translate(102.0,265)"><title>PI-107: Reactor pressure</title><rect class="inst" x="-19" y="-19" width="38" height="38"/><circle class="inst" r="17"/><line class="inst" x1="-17" y1="0" x2="17" y2="0"/><text class="ti" y="-4" text-anchor="middle">PI</text><text class="ti" y="11" text-anchor="middle">107</text></g><g id="LI-108" data-tag="LI-108" data-unit="R-101" data-uom="%" transform="translate(150.0,265)"><title>LI-108: Reactor level</title><rect class="inst" x="-19" y="-19" width="38" height="38