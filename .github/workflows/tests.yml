name: tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Networked setup is explicit: TE replay fixtures are ignored, not committed.
      # The fetcher accepts only the pinned SHA-256 bytes; failure stops the job.
      - name: Stage checksum-verified public TE fixtures
        run: python scripts/fetch_te_data.py
      # Second source for the topology check (revised TE code, Ricker's archive), pinned by SHA-256; report only.
      - name: Stage the revised TE code
        run: python scripts/verify_te_topology.py
      # The committed ZIP is a historical baseline; build current artifacts locally.
      - name: Generate current offline gateway artifacts
        run: python scripts/ignition/build_gateway.py --write-only
      # All tests run offline after setup; OPEN100 drawings/keys are committed.
      - name: Run full cached-data suite
        run: python scripts/run_tests.py --full
