name: tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Every test runs here, the scorer controls included: the OPEN100 drawings and answer keys are in the repo.
      - run: python scripts/run_tests.py
