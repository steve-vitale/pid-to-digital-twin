<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 810" width="1260" height="810"><title>Bayer CropScience methomyl residue treater (Institute, West Virginia), as described by the CSB: overview (generated)</title><defs><style>.eq{fill:#fff;stroke:#1f2937;stroke-width:2}.ln{fill:none;stroke:#1f2937;stroke-width:2}.pipe{fill:none;stroke:#475569;stroke-width:2.5}.inst{fill:#fff;stroke:#2563eb;stroke-width:1.5}.t{font:12px Arial,sans-serif;fill:#1f2937}.ti{font:bold 10px Arial,sans-serif;fill:#2563eb}.ts{font:10px Arial,sans-serif;fill:#64748b}</style><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><text class="t" x="10" y="20">Bayer CropScience methomyl residue treater (Institute, West Virginia), as described by the CSB: overview (generated)</text><polyline class="pipe" data-stream="S1" points="40,230 160,230" marker-end="url(#arr)"><title>S1 Flasher bottoms feed (methomyl-solvent liquid)</title></polyline><polyline class="pipe" data-stream="S2" points="460,490 580,490" marker-end="url(#arr)"><title>S2 Solvent fill</title></polyline><polyline class="pipe" data-stream="S3" points="160,230 580,490" marker-end="url(#arr)"><title>S3 Recirculation suction</title></polyline><polyline class="pipe" data-stream="S4" points="580,490 1000,230" marker-end="url(#arr)"><title>S4 Recirculation to the heater</title></polyline><polyline class="pipe" data-stream="S5" points="580,490 1000,490" marker-end="url(#arr)"><title>S5 Recirculation to the cooler</title></polyline><polyline class="pipe" data-stream="S10" points="1000,230 160,230" marker-end="url(#arr)"><title>S10 Recirculation return to the residue treater (heater and cooler outlets joined)</title></polyline><polyline class="pipe" data-stream="S6" points="580,520 700,560" marker-end="url(#arr)"><title>S6 Discharge to the auxiliary (alternate) fuel tank</title></polyline><polyline class="pipe" data